# OpentronsSiLA2Server Configuration
# =============================================================================

server:
  host: "0.0.0.0"
  port: 50302
  name: "Opentrons Flex"
  description: "SiLA2 Server for Opentrons Flex Robot"
  vendor: "ChemicalLab"
  version: "1.0.0"

robot:
  # Opentrons Flex HTTP API.
  # `ip` here is just the first place to look. The switch assigns the robot's
  # address by DHCP, so on startup the server checks whether the robot still
  # answers at this IP; if not, it finds it again via mDNS and uses that
  # (no need to edit this file when the address changes). It also re-discovers
  # if the connection is lost while running.
  # This is the robot's link-local address (169.254.0.0/16) on the direct
  # wire — it never changes, unlike the switch's DHCP lease on 10.16.0.x,
  # and is confirmed serving the HTTP API here. To pin a different address,
  # set a DHCP reservation on the switch for the robot's MAC, or export
  # OPENTRONS_ROBOT_IP=<ip> (that env var wins outright and disables the
  # mDNS fallback).
  ip: "169.254.161.83"
  port: 31950
  timeout: 30
  # Max seconds to wait for a recipe/protocol run to finish.
  # 0 = unlimited (a protocol may legitimately run for hours or days, e.g.
  # multi-day hydrogel curing with periodic Tecan reads).
  run_timeout: 7200
  # Local address to bind (needed for link-local routing on Windows with Hyper-V)
  # local_address: "169.254.161.1"
  # Retry settings
  connection_retry_count: 3
  connection_retry_delay: 2.0
  
hardware:
  # Hardware configuration folder (contains multiple JSON configs)
  config_folder: "../../Library/HardwareConfig"
  # Default config file (can be changed at runtime)
  default_config: "Standard_Flex_Setup.json"

directories:
  # Relative to OpentronsSiLA2Server folder
  input_queue: "./input"
  processed: "./processed"
  errors: "./errors"
  output: "./output"
  images: "./images"
  logs: "./logs"
  # Shared directories (relative to OpentronsSiLA2Server folder, same depth as hardware.config_folder)
  library: "../../Library"
  recipes: "../../Library/Recipes"
  results: "../../Results"
  protocols: "../../Protocols"

tip_tracking:
  enabled: true
  state_file: "./tip_state.json"
  # Per-mount "does it still have a tip attached" state, reconstructed from
  # each run's command log. Used by safety.check_tip_before_run.
  mount_state_file: "./tip_mount_state.json"

safety:
  emergency_protocol: "../000_EMERGENCY_RESET.json"
  auto_home_on_error: true
  auto_drop_tip_on_abort: true
  check_tip_before_run: true

logging:
  level: "INFO"
  file_enabled: true
  console_enabled: true
  max_file_size_mb: 10
  backup_count: 5

run_archive:
  # Local copy of each run's command log + summary (status, duration, tip
  # usage, estimate-vs-actual waste). A convenience supplement for debugging
  # and reconciliation - NOT the sole historical record: the originals stay
  # recoverable from the Opentrons App/API until the run is removed there -
  # so retention here is deliberately kept short.
  enabled: true
  dir: "./run_archive"
  # Days to keep the raw JSON uncompressed before gzip'ing it.
  retention_uncompressed_days: 3
  # Total days (from original run time, not from compression time) before a
  # compressed archive is deleted.
  retention_compressed_days: 30
