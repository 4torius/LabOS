system:
  name: LabOS
  version: 2.0.0
  log_level: INFO
  auto_start_servers: true
paths:
  library: Library
  labware: Library/Labware
  plates: Library/Labware/Plates
  templates: Library/Templates
  tipracks: Library/Labware/TipRacks
  pipettes: Library/Labware/Pipettes
  recipes: Library/Recipes
  hardware_config: Library/HardwareConfig
  analysis: Library/Analysis
  workflows: Library/Workflows
  results: Results
# Bootstrap seeds — used only at startup to pre-populate the PnP registry
# before mDNS has had time to announce servers (or for servers on remote subnets
# where mDNS multicast cannot reach).  Only host/port/name are used here;
# all capability metadata is fetched from the running server via SiLAService.
servers:
  tecan:
    name: Tecan M200 Pro
    enabled: true
    host: localhost
    port: 50051
    directory: SiLA2/TecanM200SiLA2Server   # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 30
    check_file: main.py
  opentrons:
    name: Opentrons Flex
    enabled: true
    host: localhost
    port: 50302
    directory: SiLA2/OpentronsSiLA2Server   # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 45
    check_file: main.py
  mobile:
    name: Mobile Robot
    enabled: true
    host: 192.168.11.22    # zbox — Docker-based deployment, container `mobile-sila2`
    port: 50053
    # The bootstrap seed is kept regardless of whether mDNS reaches it: when the
    # orchestrator is joined to the robot PC's hotspot this is the same L2
    # network and the announcement arrives, but the seed costs one gRPC probe at
    # startup and means the robot is still found if the network is arranged some
    # other way. An earlier comment here claimed a different subnet; that
    # described an older setup.
    remote: true           # Runs on external Linux PC, not started locally
    network:
      connection_timeout: 5
      retry_count: 3
      ros_master_uri: http://localhost:11311
      ros_namespace: /setup1
  manual_station:
    name: Manual Station
    enabled: true
    host: localhost
    port: 50500
    directory: SiLA2/ManualStationSiLA2Server  # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 10
    check_file: main.py
discovery:
  enabled: true
  scan_interval: 30
  service_type: _sila._tcp.local.   # SiLA2-standard mDNS service type
  bootstrap_timeout_s: 5            # per-server gRPC check timeout at startup
workflow:
  parallel_execution: false
  # Fallback timeout (seconds) for any workflow step that doesn't set its own
  # TimeoutSeconds. 600s covers quick instrument calls; 0 or null means no
  # global fallback (not recommended — steps that hang go undetected). For a
  # genuinely long-running step (e.g. a multi-day incubation), prefer setting
  # TimeoutSeconds: 0 on that one step instead of raising/removing this default.
  default_timeout: 600
  retry_on_failure: false
  max_retries: 3
error_handling:
  retry_strategy: exponential
  base_delay_seconds: 1
  max_delay_seconds: 60
  max_retries: 3
  enable_human_intervention: true
ui_dropdowns:
  # recipe, analysis, hal_config, liquid_class, mobile_task are declared by each
  # server via LabOSLibraryProvider.LibraryCatalog — no static entries needed here.

  # Labware catalogs use index.json with special parsing — kept here.
  pipette:
    folder: Library/Labware/Pipettes
    file_extension: .json
  plate:
    folder: Library/Labware/Plates
    file_extension: .json
  tiprack:
    folder: Library/Labware/TipRacks
    file_extension: .json
  # mobile_task is read from the robot's AvailableTasks property. A server can
  # declare this in its own library_catalog.json; the mobile robot's server
  # runs on another machine and does not yet, so the declaration lives here.
  # The last list read is kept in `folder` for when the robot is off.
  mobile_task:
    dynamic: true
    server: mobile
    source_property: AvailableTasks
    value_field: TaskId
    label_field: TaskName
    folder: Library/MobileTasks
webapp:
  nodered_url: http://localhost:1880
  timeouts:
    intervention_timeout: 3600
    manual_action_timeout: 600
    tip_refill_timeout: 600
    discovery_timeout: 3
  ui:
    auto_refresh_interval: 3
    toast_duration: 15
    workflow_status_auto_hide: 10

# ── Physical resource claims ──────────────────────────────────────────────────
# Normally empty. An instrument declares what it occupies in its own
# library_catalog.json, served over LabOSLibraryProvider — so the Opentrons,
# the Tecan and the Manual Station need nothing here.
#
# This section is only for what no server can speak for, and the mobile robot
# is that case for one reason: its catalog is a file inside the `mobile-sila2`
# container on the robot PC, and that server's source is not in this repository
# or in this deployment. Note what the reason is NOT — it is not reachability.
# Being on the same network lets the orchestrator talk to that server; it does
# not let anyone here edit a file inside its image.
#
# So this entry is provisional by design. If the robot's own
# library_catalog.json gains a `resources` section, that wins: a server is the
# authority on itself, this block is then ignored, and `labos.py resources`
# says so. Moving the declaration there is the better end state.
#
# The layer earns its place permanently for a different case: a SiLA2 server
# shipped by an instrument vendor cannot be modified at all, and without this
# the model would be closed to every instrument we did not write.
#
# The claims below mirror the tasks taught by demonstration against each
# workstation's ArUco marker. `deck:opentrons` and `tray:tecan` are the ids
# those two servers declare they own, so a transport task and the instrument's
# own work exclude each other without either server knowing the other exists.
# Re-teaching a task, or teaching a new one, means adding a line here.
#
# See docs/RESOURCE_MODEL.md.
resources:
  declare:
    mobile:
      provides:
      - instrument:mobile
      commands:
        ExecuteTask:
          claims:
          - instrument:mobile
          by_parameter:
            # Keyed on BOTH spellings on purpose. The workflow builder writes
            # TaskId (the opaque id the robot's platform assigns when a task is
            # taught); a hand-written workflow or a future UI may write
            # TaskName. Declaring only TaskName would have matched nothing in
            # Test_Bicocca, and a claim that never matches means no exclusion,
            # silently — which is the one failure this model exists to prevent.
            # Unmatched entries simply contribute nothing, so listing both is
            # free. Keep the two lists in step when a task is re-taught: the
            # id changes.
            TaskId:
              dxvadjvibetfceaybdybsqsqcmzimdfj:   # place_on_OT
              - deck:opentrons
              qufptekmeyycpckgbvcpudozfdfkctba:   # pick_from_opentrons
              - deck:opentrons
              obwlfxkzdevvwcueaeekddafeaabccyb:   # go_to_opentrons (lowercase twin)
              - instrument:mobile
              nnegfohactaltbahtxfnejaaycafskaq:   # pick_from_tecan
              - tray:tecan
              rxzeeofvewbamneadgvdafucvefidfgb:   # place_on_TC
              - tray:tecan
            TaskName:
              place_on_OT:
              - deck:opentrons
              pick_from_opentrons:
              - deck:opentrons
              pick_from_tecan:
              - tray:tecan
              place_on_TC:
              - tray:tecan
              # go_to_Opentrons, go_to_Tecan, Docking, WorkingPose and
              # pick_from_dima move the base or the arm without entering
              # another instrument, so they occupy only the robot.
        CancelTask:
          control: true
        RefreshTasks:
          control: true
        GetTaskDetails:
          control: true
  # Aliases exist for the one binding that is genuinely deployment-variable:
  # a task is taught against a marker, so swapping the instrument behind that
  # marker changes the claim target while the taught motion stays valid.
  # None needed today.
  aliases: {}
