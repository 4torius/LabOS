system:
  name: LabOS
  version: 2.0.0
  log_level: INFO
  auto_start_servers: true
paths:
  library: Library
  labware: Library/Labware
  plates: Library/Labware/Plates
  templates: Library/Templates
  tipracks: Library/Labware/TipRacks
  pipettes: Library/Labware/Pipettes
  recipes: Library/Recipes
  hardware_config: Library/HardwareConfig
  analysis: Library/Analysis
  workflows: Library/Workflows
  results: Results
# Bootstrap seeds — used only at startup to pre-populate the PnP registry
# before mDNS has had time to announce servers (or for servers on remote subnets
# where mDNS multicast cannot reach).  Only host/port/name are used here;
# all capability metadata is fetched from the running server via SiLAService.
servers:
  tecan:
    name: Tecan M200 Pro
    enabled: true
    host: localhost
    port: 50051
    directory: SiLA2/TecanM200SiLA2Server   # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 30
    check_file: main.py
  opentrons:
    name: Opentrons Flex
    enabled: true
    host: localhost
    port: 50302
    directory: SiLA2/OpentronsSiLA2Server   # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 45
    check_file: main.py
  mobile:
    name: Mobile Robot
    enabled: true
    host: 192.168.11.22    # zbox — Docker-based deployment, container `mobile-sila2`
    port: 50053
    directory: SiLA2/MobileSiLA2Server   # where its code lives; it runs on the robot PC
    # The bootstrap seed is kept regardless of whether mDNS reaches it: when the
    # orchestrator is joined to the robot PC's hotspot this is the same L2
    # network and the announcement arrives, but the seed costs one gRPC probe at
    # startup and means the robot is still found if the network is arranged some
    # other way. An earlier comment here claimed a different subnet; that
    # described an older setup.
    remote: true           # Runs on external Linux PC, not started locally
    network:
      connection_timeout: 5
      retry_count: 3
      ros_master_uri: http://localhost:11311
      ros_namespace: /setup1
  manual_station:
    name: Manual Station
    enabled: true
    host: localhost
    port: 50500
    directory: SiLA2/ManualStationSiLA2Server  # used by server auto-start only
    command_windows:
    - python
    - main.py
    command_unix:
    - python
    - main.py
    startup_timeout: 10
    check_file: main.py
discovery:
  enabled: true
  scan_interval: 30
  service_type: _sila._tcp.local.   # SiLA2-standard mDNS service type
  bootstrap_timeout_s: 5            # per-server gRPC check timeout at startup
workflow:
  # At most this many steps at once. What may overlap is decided by what each
  # step physically occupies (see `python labos.py resources`); this is a cap
  # on top of that. 1 = strictly one step at a time, which is how this lab has
  # always run, and what a config without this line also gets. Raise it (0 =
  # no cap) only after the bench tests in docs/SIMULATED_LAB.md have passed
  # AND the robot PC runs the MobileSiLA2Server from this repository - until
  # it does, the robot declares nothing and its steps are not excluded from
  # the Opentrons deck.
  # (`parallel_execution: false` used to be written here; it is retired, and
  # is still read as a cap of 1 if an old config carries it.)
  max_concurrency: 1
  # Fallback timeout (seconds) for any workflow step that doesn't set its own
  # TimeoutSeconds. 600s covers quick instrument calls; 0 or null means no
  # global fallback (not recommended — steps that hang go undetected). For a
  # genuinely long-running step (e.g. a multi-day incubation), prefer setting
  # TimeoutSeconds: 0 on that one step instead of raising/removing this default.
  default_timeout: 600
  # false: a failed step is NOT sent again on its own - the operator is asked.
  # A step that is safe to repeat can say so with its own RetryCount.
  # true: retried error_handling.max_retries times first.
  retry_on_failure: false
  max_retries: 3
error_handling:
  retry_strategy: exponential
  base_delay_seconds: 1
  max_delay_seconds: 60
  max_retries: 3
  enable_human_intervention: true
ui_dropdowns:
  # Hints that belong to no single instrument. This is their rightful home, not
  # a fallback: `plate`, `tiprack` and `pipette` are properties of THIS LAB'S
  # INVENTORY, and the Opentrons does not own the list of plate definitions the
  # lab possesses. A server declares what a server can know (recipe, analysis,
  # hal_config, liquid_class — see each server's library_catalog.json); this is
  # what no server can speak for. See src/options.py.
  #
  # The four entries below used to be `if ui_hint == "..."` branches inside
  # lab_core._get_options_for_hint, with the folder walks written out in
  # Python, each sitting next to a config entry for the same hint — two sources
  # that could disagree. They are data now.

  plate:
    display_name: Plate
    sources:
    - glob: Library/Labware/Plates/*.plate.json
      field: id
    parameter_names: [PlateType, PlateID]

  # Every load name this lab has a definition for. The dashboard used to offer
  # six invented ones (tiprack_1000ul, wellplate_96, …) matching nothing
  # Opentrons knows, so choosing any of them failed the run.
  labware:
    display_name: Labware
    sources:
    - glob: Library/Labware/Plates/*.plate.json
      field: id
    - glob: Library/Labware/Reservoirs/*.json
      fields: [parameters.loadName, id]
    - file: Library/Labware/TipRacks/index.json
      list_key: load_names
    parameter_names: [LoadName]

  tiprack:
    display_name: Tip rack
    sources:
    - file: Library/Labware/TipRacks/index.json
      list_key: load_names

  pipette:
    display_name: Pipette
    sources:
    - file: Library/Labware/Pipettes/index.json
      items_key: definitions
      key_template: '{channel}/{model}'

  # Read from the robot's AvailableTasks property. The robot's server could
  # declare this itself; its catalog is a file inside a container whose source
  # is not in this repository, so the declaration lives here for now.
  #
  # `folder` here is NOT a source of values — it is the snapshot of the last
  # list read, used when the robot is off. For a dynamic hint the two are
  # different roles that happen to share a key name, so it stays at the top
  # level rather than going under `sources`: declaring it as a source made the
  # folder's own file names (including `_options`) show up as pickable tasks.
  mobile_task:
    display_name: Mobile task
    dynamic: true
    server: mobile
    source_property: AvailableTasks
    value_field: TaskId
    label_field: TaskName
    folder: Library/MobileTasks

webapp:
  nodered_url: http://localhost:1880
  timeouts:
    intervention_timeout: 3600
    manual_action_timeout: 600
    tip_refill_timeout: 600
    discovery_timeout: 3
  ui:
    auto_refresh_interval: 3
    toast_duration: 15
    workflow_status_auto_hide: 10

# ── Physical resource claims ──────────────────────────────────────────────────
# Normally empty. An instrument declares what it occupies in its own
# library_catalog.json, served over LabOSLibraryProvider - the Opentrons, the
# Tecan, the Manual Station and, now that its server is in this repository
# (SiLA2/MobileSiLA2Server), the mobile robot too.
#
# `declare` is for what no server can speak for: an instrument whose SiLA2
# server is shipped by a vendor and cannot be modified. An entry is keyed by
# the server's key under `servers:` above, e.g.
#
#   declare:
#     incubator:
#       provides: [instrument:incubator, door:incubator]
#       commands:
#         OpenDoor: {claims: [door:incubator]}
#
# If the server also declares for itself, the server wins and
# `python labos.py resources` says this entry is ignored. An entry whose key
# matches no instrument is reported there too, rather than silently dropped.
#
# The robot used to be declared here, by task id. Its declaration now lives in
# SiLA2/MobileSiLA2Server/library_catalog.json, by task NAME, and the server
# works out the ids. Until the robot PC is redeployed from this repository the
# running server still declares nothing, and the Settings page lists the robot
# under "Declaring nothing".
#
# See docs/RESOURCE_MODEL.md.
resources:
  declare: {}
  # Aliases exist for the one binding that is genuinely deployment-variable:
  # a task is taught against a marker, so swapping the instrument behind that
  # marker changes the claim target while the taught motion stays valid.
  # None needed today.
  aliases: {}
