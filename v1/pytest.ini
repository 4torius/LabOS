[pytest]
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    integration: requires running SiLA2 servers
    tecan: requires Tecan server on port 50051
    opentrons: requires Opentrons server on port 50057
    manual_station: requires ManualStation server on port 50360
    mobile: requires remote MobileSiLA2Server reachable on the network
